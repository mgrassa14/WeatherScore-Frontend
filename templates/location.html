<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Location Selector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="{{ url_for('static', filename='js/location.js') }}" defer></script>
  </head>

  <body class="bg-light">

    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
      <div class="card shadow p-4" style="width: 450px;">

        <h3 class="text-center mb-3">Choose Location</h3>

        <!-- NAV TABS -->
        <nav class="nav justify-content-center">
          <div class="nav nav-tabs" id="location-tab" role="tablist">
            <!-- <button class="nav-link active" id="auto-tab" data-bs-toggle="tab" data-bs-target="#auto" type="button" role="tab">
              Use My Location
            </button> -->
            <!-- <button class="nav-link" id="manual-tab" data-bs-toggle="tab" data-bs-target="#manual" type="button" role="tab"></button> -->
            <button class="nav-link" id="auto-tab" data-bs-toggle="tab" data-bs-target="#manual" type="button" role="tab">
              Enter Location
            </button>
          </div>
        </nav>

        <!-- TAB CONTENT -->
        <div class="tab-content mt-3" id="location-tabContent">

          <!-- AUTO LOCATION TAB -->
          <!-- <div class="tab-pane fade show active" id="auto" role="tabpanel" aria-labelledby="auto-tab">
            <p>Allow your browser to access your location.</p>
            <button class="btn btn-primary w-100" id="getLocationBtn">Use My Location</button>
          </div> -->

          <!-- MANUAL ZIP TAB -->
          <div class="tab-pane fade show active" id="manual" role="tabpanel" aria-labelledby="manual-tab">

            <form class="row g-3">

            <div class="col-12">
                <label for="validationServer03" class="form-label">City</label>
                <input type="text" class="form-control is-invalid" id="validationServer03" required>
                <div class="invalid-feedback">Please provide a valid city.</div>
            </div>

            <div class="col-12">
                <label for="validationServer04" class="form-label">State</label>
                <select class="form-select is-invalid" id="validationServer04" required>
                <option selected disabled value="">Choose...</option>
                <option value="AL">Alabama</option>
                <option value="AK">Alaska</option>
                <option value="AZ">Arizona</option>
                <option value="AR">Arkansas</option>
                <option value="CA">California</option>
                <option value="CO">Colorado</option>
                <option value="CT">Connecticut</option>
                <option value="DE">Delaware</option>
                <option value="FL">Florida</option>
                <option value="GA">Georgia</option>
                <option value="HI">Hawaii</option>
                <option value="ID">Idaho</option>
                <option value="IL">Illinois</option>
                <option value="IN">Indiana</option>
                <option value="IA">Iowa</option>
                <option value="KS">Kansas</option>
                <option value="KY">Kentucky</option>
                <option value="LA">Louisiana</option>
                <option value="ME">Maine</option>
                <option value="MD">Maryland</option>
                <option value="MA">Massachusetts</option>
                <option value="MI">Michigan</option>
                <option value="MN">Minnesota</option>
                <option value="MS">Mississippi</option>
                <option value="MO">Missouri</option>
                <option value="MT">Montana</option>
                <option value="NE">Nebraska</option>
                <option value="NV">Nevada</option>
                <option value="NH">New Hampshire</option>
                <option value="NJ">New Jersey</option>
                <option value="NM">New Mexico</option>
                <option value="NY">New York</option>
                <option value="NC">North Carolina</option>
                <option value="ND">North Dakota</option>
                <option value="OH">Ohio</option>
                <option value="OK">Oklahoma</option>
                <option value="OR">Oregon</option>
                <option value="PA">Pennsylvania</option>
                <option value="RI">Rhode Island</option>
                <option value="SC">South Carolina</option>
                <option value="SD">South Dakota</option>
                <option value="TN">Tennessee</option>
                <option value="TX">Texas</option>
                <option value="UT">Utah</option>
                <option value="VT">Vermont</option>
                <option value="VA">Virginia</option>
                <option value="WA">Washington</option>
                <option value="WV">West Virginia</option>
                <option value="WI">Wisconsin</option>
                <option value="WY">Wyoming</option>
                </select>
                <div class="invalid-feedback">Please select a valid state.</div>
            </div>

            <div class="col-12">
                <label for="validationServer05" class="form-label">Zip</label>
                <input type="text" class="form-control is-invalid" id="validationServer05" required>
                <div class="invalid-feedback">Please provide a valid zip.</div>
            </div>

            <div class="col-12 text-center">
                <button class="btn btn-primary w-100" type="submit">Submit form</button>
            </div>

            </form>

          </div>

        </div>

      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- <script src="{{ url_for('static', filename='js/location.js') }}"></script> -->
  </body>
</html>
