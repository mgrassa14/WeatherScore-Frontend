<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Location Selector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>

  <body class="bg-light">

    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
      <div class="card shadow p-4" style="width: 450px;">

        <h3 class="text-center mb-3">Choose Location</h3>

        <!-- NAV TABS -->
        <nav class="nav justify-content-center">
          <div class="nav nav-tabs" id="location-tab" role="tablist">
            <!-- <button class="nav-link active" id="auto-tab" data-bs-toggle="tab" data-bs-target="#auto" type="button" role="tab">
              Use My Location
            </button> -->
            <!-- <button class="nav-link" id="manual-tab" data-bs-toggle="tab" data-bs-target="#manual" type="button" role="tab"></button> -->
            <button class="nav-link" id="auto-tab" data-bs-toggle="tab" data-bs-target="#manual" type="button" role="tab">
              Enter Location
            </button>
          </div>
        </nav>

        <!-- TAB CONTENT -->
        <div class="tab-content mt-3" id="location-tabContent">

          <!-- AUTO LOCATION TAB -->
          <!-- <div class="tab-pane fade show active" id="auto" role="tabpanel" aria-labelledby="auto-tab">
            <p>Allow your browser to access your location.</p>
            <button class="btn btn-primary w-100" id="getLocationBtn">Use My Location</button>
          </div> -->

          <!-- MANUAL ZIP TAB -->
          <div class="tab-pane fade show active" id="manual" role="tabpanel" aria-labelledby="manual-tab">

            <form class="row g-3">

            <div class="col-12">
                <label for="validationServer03" class="form-label">City</label>
                <input type="text" class="form-control is-invalid" id="validationServer03" required>
                <div class="invalid-feedback">Please provide a valid city.</div>
            </div>

            <div class="col-12">
                <label for="validationServer04" class="form-label">State</label>
                <select class="form-select is-invalid" id="validationServer04" required>
                <option selected disabled value="">Choose...</option>
                <option>...</option>
                </select>
                <div class="invalid-feedback">Please select a valid state.</div>
            </div>

            <div class="col-12">
                <label for="validationServer05" class="form-label">Zip</label>
                <input type="text" class="form-control is-invalid" id="validationServer05" required>
                <div class="invalid-feedback">Please provide a valid zip.</div>
            </div>

            <div class="col-12">
                <div class="form-check">
                <input class="form-check-input is-invalid" type="checkbox" id="invalidCheck3" required>
                <label class="form-check-label" for="invalidCheck3">
                    Agree to terms and conditions
                </label>
                <div class="invalid-feedback">You must agree before submitting.</div>
                </div>
            </div>

            <div class="col-12 text-center">
                <button class="btn btn-primary w-100" type="submit">Submit form</button>
            </div>

            </form>

          </div>

        </div>

      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src=""></script>
  </body>
</html>
